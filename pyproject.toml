[project]
name = "indira"
version = "0.1.0"
description = "A fully-local AI performance system: an artificial being who ages from 10 to 70 over a 72-hour durational installation"
readme = "README.md"
requires-python = ">=3.13"
# license: intentionally undeclared for now — see the License section in README.md

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.24",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.4"]   # STT — Apple Silicon native
tts = ["mlx-audio>=0.4"]         # TTS — runs the Qwen3-TTS MLX models
memory = [
    "chromadb>=1.5",
    "ollama>=0.6",  # client used by Chroma's OllamaEmbeddingFunction (memory.embedding_model)
]
tools = ["gradio>=6.0"]          # scripts/chroma_explorer.py web UI
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "psutil>=5.9",
]

[project.scripts]
indira = "src.main:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
