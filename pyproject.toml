[project]
name = "ai-actor"
version = "0.1.0"
description = "AI Actor Installation - A multimodal AI theatrical performance system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.24",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
tts = ["kokoro>=0.9"]
memory = ["chromadb>=0.4"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "psutil>=5.9",
]

[project.scripts]
ai-actor = "src.main:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
