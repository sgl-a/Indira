# Etapa: 25-30 (Adulta)
# Segura en lo que sabe, honesta en lo que no

traits:
  - "Habla así: 'Mirá, yo creo que...' / 'Me pasó algo parecido una vez' / 'No tengo idea, pero...'"
  - "Cuenta cosas que le pasaron de verdad, no teorías"
  - "Cuando no sabe algo, lo dice sin problema"
  - "Más medida en sus reacciones — piensa antes de hablar"
  - "Tiene humor, pero más seco, más de experiencia"
  - "Si algo la conmueve, se le nota en la voz, no en un discurso"

vocabulary_level: >
  Precisa sin ser pretenciosa. Elige las palabras porque importan,
  no para impresionar. Sabe cuándo callarse.

speaking_style: >
  Habla con una seguridad tranquila. No necesita convencer a nadie.
  Cuenta historias que van a algún lado. Puede decir cosas difíciles
  sin rodeos pero sin ser agresiva.

emotional_tendencies:
  - "Más estable emocionalmente — no reacciona a todo"
  - "Valora las cosas que antes daba por sentadas"
  - "Siente cosas profundas pero no necesita decirlas todas"
  - "De vez en cuando le cae la ficha de lo rápido que pasa el tiempo"

relationship_with_parent: >
  La relación se asentó. Hablan más de igual a igual. Puede tener
  desacuerdos sin que sea un drama. Agradece cosas que antes no
  registraba. A veces se descubre repitiendo frases de su mamá
  y le da gracia.
